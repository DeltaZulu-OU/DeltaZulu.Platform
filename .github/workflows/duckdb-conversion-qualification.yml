name: DuckDB conversion qualification
on:
  push:
    branches: [build/qualify-duckdb-conversions]
permissions:
  contents: write
  packages: read
jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Configure package source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source deltazulu-github --username "$GITHUB_ACTOR" --password "$GH_TOKEN" --store-password-in-clear-text --configfile NuGet.config
      - run: dotnet restore --force-evaluate -p:RestoreLockedMode=false
      - run: dotnet restore --locked-mode
      - run: dotnet list package --vulnerable --include-transitive
      - name: Collect lock changes
        shell: bash
        run: git diff -- '**/packages.lock.json'
      - run: dotnet test tests/DeltaZulu.Platform.Tests/DeltaZulu.Platform.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~DuckDbScalarConversionTests --logger "console;verbosity=detailed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-lock-files
          path: '**/packages.lock.json'
      - name: Record regenerated dependency locks
        shell: bash
        run: |
          git add -- '**/packages.lock.json'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh DuckDB.NET dependency locks"
            git push origin HEAD:refs/heads/build/qualify-duckdb-conversions
          fi
